name: Release

# After CI on main (or manual dispatch): publish Docker image when package.json
# version changes. Does NOT create GitHub Releases.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (empty = package.json)'
        required: false
        type: string
      source_ref:
        description: 'Git ref/SHA to build (empty = this branch head)'
        required: false
        type: string
      force:
        description: 'Force Docker publish even if version did not change'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Resolve version and whether to publish
        id: plan
        env:
          # 经 env 传递而非直接内插进 run 脚本，避免 workflow_dispatch 输入含 shell 元字符
          # 时构成脚本注入（第 27 轮盲审 L3）
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          FORCE: ${{ inputs.force }}
          REF_NAME: ${{ github.ref_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu

          read_version() {
            node --input-type=module -e "
              import fs from 'node:fs';
              const pkg = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              const version = pkg.version;
              if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
                console.error('Invalid package.json version:', version);
                process.exit(1);
              }
              process.stdout.write(version);
            " "$1"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"
            # 与 read_version 的 package.json 校验同一条 semver 正则；手动输入未过校验则直接失败
            if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::workflow_dispatch input 'version' must be semver like 1.2.3 or 1.2.3-beta.1 (got '${VERSION}')"
              exit 1
            fi
          else
            VERSION="$(read_version package.json)"
          fi

          TARGET_SHA="$(git rev-parse HEAD)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_SOURCE_REF" ]; then
            SOURCE_REF="$INPUT_SOURCE_REF"
          else
            # Prefer the commit that just passed CI (no GitHub Release tag required).
            SOURCE_REF="${TARGET_SHA}"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            WORKFLOW_REF="$REF_NAME"
          else
            WORKFLOW_REF="$RUN_HEAD_BRANCH"
          fi

          VERSION_CHANGED=false
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git show "HEAD^:package.json" >/tmp/prev-package.json 2>/dev/null; then
              PREV_VERSION="$(read_version /tmp/prev-package.json || true)"
              if [ -n "${PREV_VERSION}" ] && [ "${PREV_VERSION}" != "${VERSION}" ]; then
                VERSION_CHANGED=true
              fi
            else
              # package.json added or unreadable at parent — treat as changed.
              VERSION_CHANGED=true
            fi
          else
            VERSION_CHANGED=true
          fi

          RUN_NAME="Docker Publish v${VERSION}"
          # --limit 1000: the default 100 can miss an older successful run once
          # the workflow has accumulated more than 100 runs.
          SUCCESS_COUNT="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "docker-publish.yml" \
            --limit 1000 \
            --json displayTitle,conclusion \
            --jq "[.[] | select(.displayTitle == \"${RUN_NAME}\" and .conclusion == \"success\")] | length")"

          if [ "${SUCCESS_COUNT}" -gt 0 ]; then
            PUBLISH_EXISTS=true
          else
            PUBLISH_EXISTS=false
          fi

          SHOULD_PUBLISH=false
          REASON="skip"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE" = "true" ] || [ "${VERSION_CHANGED}" = "true" ] || [ "${PUBLISH_EXISTS}" = "false" ]; then
              SHOULD_PUBLISH=true
              REASON="workflow_dispatch"
            else
              # Manual run with unchanged version and an already-published image:
              # publish only when force=true (handled above).
              SHOULD_PUBLISH=false
              REASON="manual run: version unchanged and image already published (set force=true to override)"
            fi
          elif [ "${VERSION_CHANGED}" = "true" ]; then
            SHOULD_PUBLISH=true
            REASON="package.json version changed (${PREV_VERSION:-none} -> ${VERSION})"
          elif [ "${PUBLISH_EXISTS}" = "false" ]; then
            # Version bump landed earlier but image never succeeded (e.g. CI fixed later).
            SHOULD_PUBLISH=true
            REASON="no successful Docker Publish for v${VERSION} yet"
          else
            SHOULD_PUBLISH=false
            REASON="version unchanged (${VERSION}) and image already published"
          fi

          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "workflow_ref=${WORKFLOW_REF}"
            echo "version_changed=${VERSION_CHANGED}"
            echo "publish_exists=${PUBLISH_EXISTS}"
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "reason=${REASON}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VERSION}"
          echo "source_ref=${SOURCE_REF}"
          echo "version_changed=${VERSION_CHANGED}"
          echo "publish_exists=${PUBLISH_EXISTS}"
          echo "should_publish=${SHOULD_PUBLISH}"
          echo "reason=${REASON}"

      - name: Trigger Docker publish workflow
        if: steps.plan.outputs.should_publish == 'true'
        env:
          # 经 env 传递：workflow_ref 在 dispatch 场景源自 git 分支名（可含 " $ 反引号等
          # shell 元字符），直接内插进 run 有脚本注入面（round-27 只覆盖了 plan 步，
          # 本步是漏网，第 31 轮盲审 L1）
          GITHUB_REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ steps.plan.outputs.workflow_ref }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
        run: |
          gh workflow run docker-publish.yml \
            --repo "$GITHUB_REPO" \
            --ref "$WORKFLOW_REF" \
            -f version="$VERSION" \
            -f source_ref="$SOURCE_REF"

      - name: Skip Docker publish
        if: steps.plan.outputs.should_publish != 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "Skipping Docker publish: $REASON"
