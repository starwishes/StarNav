name: Release

# After CI on main (or manual dispatch): publish Docker image when package.json
# version changes. Does NOT create GitHub Releases.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (empty = package.json)'
        required: false
        type: string
      source_ref:
        description: 'Git ref/SHA to build (empty = this branch head)'
        required: false
        type: string
      force:
        description: 'Force Docker publish even if version did not change'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Resolve version and whether to publish
        id: plan
        run: |
          set -eu

          read_version() {
            node --input-type=module -e "
              import fs from 'node:fs';
              const pkg = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              const version = pkg.version;
              if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
                console.error('Invalid package.json version:', version);
                process.exit(1);
              }
              process.stdout.write(version);
            " "$1"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(read_version package.json)"
          fi

          TARGET_SHA="$(git rev-parse HEAD)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            SOURCE_REF="${{ inputs.source_ref }}"
          else
            # Prefer the commit that just passed CI (no GitHub Release tag required).
            SOURCE_REF="${TARGET_SHA}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WORKFLOW_REF="${{ github.ref_name }}"
          else
            WORKFLOW_REF="${{ github.event.workflow_run.head_branch }}"
          fi

          VERSION_CHANGED=false
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git show "HEAD^:package.json" >/tmp/prev-package.json 2>/dev/null; then
              PREV_VERSION="$(read_version /tmp/prev-package.json || true)"
              if [ -n "${PREV_VERSION}" ] && [ "${PREV_VERSION}" != "${VERSION}" ]; then
                VERSION_CHANGED=true
              fi
            else
              # package.json added or unreadable at parent — treat as changed.
              VERSION_CHANGED=true
            fi
          else
            VERSION_CHANGED=true
          fi

          RUN_NAME="Docker Publish v${VERSION}"
          # --limit 1000: the default 100 can miss an older successful run once
          # the workflow has accumulated more than 100 runs.
          SUCCESS_COUNT="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "docker-publish.yml" \
            --limit 1000 \
            --json displayTitle,conclusion \
            --jq "[.[] | select(.displayTitle == \"${RUN_NAME}\" and .conclusion == \"success\")] | length")"

          if [ "${SUCCESS_COUNT}" -gt 0 ]; then
            PUBLISH_EXISTS=true
          else
            PUBLISH_EXISTS=false
          fi

          SHOULD_PUBLISH=false
          REASON="skip"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force }}" = "true" ] || [ "${VERSION_CHANGED}" = "true" ] || [ "${PUBLISH_EXISTS}" = "false" ]; then
              SHOULD_PUBLISH=true
              REASON="workflow_dispatch"
            else
              # Manual run with unchanged version and an already-published image:
              # publish only when force=true (handled above).
              SHOULD_PUBLISH=false
              REASON="manual run: version unchanged and image already published (set force=true to override)"
            fi
          elif [ "${VERSION_CHANGED}" = "true" ]; then
            SHOULD_PUBLISH=true
            REASON="package.json version changed (${PREV_VERSION:-none} -> ${VERSION})"
          elif [ "${PUBLISH_EXISTS}" = "false" ]; then
            # Version bump landed earlier but image never succeeded (e.g. CI fixed later).
            SHOULD_PUBLISH=true
            REASON="no successful Docker Publish for v${VERSION} yet"
          else
            SHOULD_PUBLISH=false
            REASON="version unchanged (${VERSION}) and image already published"
          fi

          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "workflow_ref=${WORKFLOW_REF}"
            echo "version_changed=${VERSION_CHANGED}"
            echo "publish_exists=${PUBLISH_EXISTS}"
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "reason=${REASON}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VERSION}"
          echo "source_ref=${SOURCE_REF}"
          echo "version_changed=${VERSION_CHANGED}"
          echo "publish_exists=${PUBLISH_EXISTS}"
          echo "should_publish=${SHOULD_PUBLISH}"
          echo "reason=${REASON}"

      - name: Trigger Docker publish workflow
        if: steps.plan.outputs.should_publish == 'true'
        run: |
          gh workflow run docker-publish.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.plan.outputs.workflow_ref }}" \
            -f version="${{ steps.plan.outputs.version }}" \
            -f source_ref="${{ steps.plan.outputs.source_ref }}"

      - name: Skip Docker publish
        if: steps.plan.outputs.should_publish != 'true'
        run: |
          echo "Skipping Docker publish: ${{ steps.plan.outputs.reason }}"
