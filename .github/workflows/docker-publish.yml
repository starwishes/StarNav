name: Docker Publish
run-name: Docker Publish ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v, e.g. 1.0.0'
        required: true
        type: string
      source_ref:
        description: 'Git ref to publish from, e.g. v1.0.0'
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release version
        id: version
        env:
          # 经 env 传递而非直接内插进 run 脚本，避免输入含 shell 元字符时构成脚本注入
          #（第 27 轮盲审 L3；GHA 官方推荐写法）
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            RAW_VERSION="$RELEASE_TAG"
            SOURCE_REF="$RELEASE_TAG"
          else
            RAW_VERSION="$INPUT_VERSION"
            SOURCE_REF="$INPUT_SOURCE_REF"
          fi
          VERSION="${RAW_VERSION#v}"

          # 手动 dispatch 的 version 未经校验会直接进入 metadata-action 的 yaml 块（可注入
          # 额外行伪造 tag/label）；与 release.yml 同一条 semver 正则，非法即 fail
          #（第 32 轮 Kimi 视角 L2）
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::docker-publish 'version' must be semver like 1.2.3 (got '${VERSION}')"
            exit 1
          fi

          if [ -z "${SOURCE_REF}" ]; then
            SOURCE_REF="$REF_NAME"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f2)" >> "$GITHUB_OUTPUT"
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/starnav
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
