name: Docker Publish
run-name: Docker Publish ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v, e.g. 1.0.0'
        required: true
        type: string
      source_ref:
        description: 'Git ref to publish from, e.g. v1.0.0'
        required: false
        type: string

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/starnav
  DOCKERHUB_IMAGE: starwisher/starnav

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_VERSION="${{ github.event.release.tag_name }}"
            SOURCE_REF="${{ github.event.release.tag_name }}"
          else
            RAW_VERSION="${{ inputs.version }}"
            SOURCE_REF="${{ inputs.source_ref }}"
          fi
          VERSION="${RAW_VERSION#v}"

          if [ -z "${SOURCE_REF}" ]; then
            SOURCE_REF="${{ github.ref_name }}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f2)" >> "$GITHUB_OUTPUT"
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.source_ref }}

      - name: Resolve publish targets
        id: targets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          publish_dockerhub=false

          if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ]; then
            publish_dockerhub=true
          fi

          {
            echo 'images<<EOF'
            echo "${GHCR_IMAGE}"
            if [ "${publish_dockerhub}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo 'EOF'
            echo "publish_dockerhub=${publish_dockerhub}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        if: steps.targets.outputs.publish_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
