name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Ops lint
        run: npm run lint:ops

      # Soft guard: conflict markers / trailing whitespace (not a full CRLF rewrite).
      - name: Git whitespace check
        run: git diff --check

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Typecheck (web + server)
        run: npm run typecheck

      - name: OpenAPI types drift check
        run: npm run openapi:types:check

      - name: Extension common sync check
        run: npm run extension:sync-common:check

      - name: Test surface stats
        run: npm run test:stats

      - name: Coverage regression
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Runtime smoke
        run: npm run test:smoke:runtime

      - name: Build
        run: npm run build

      - name: Docker smoke
        run: npm run docker:smoke
