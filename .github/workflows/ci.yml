name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Ops lint
        run: npm run lint:ops

      # Soft guard: conflict markers / trailing whitespace (not a full CRLF rewrite).
      # `git diff --check` without args compares worktree vs index — a fresh CI checkout
      # is always clean, so it never failed (no-op, round 24). Diff against the PR base
      # (or the previously pushed commit) so it actually checks the introduced changes.
      # force-push 后 github.event.before 指向的旧提交可能不在 fetch 历史中 → 兜底 origin/main。
      - name: Git whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=origin/main
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            base=origin/main
          fi
          git diff --check "$base...HEAD"

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Typecheck (web + server)
        run: npm run typecheck

      - name: OpenAPI types drift check
        run: npm run openapi:types:check

      - name: Extension common sync check
        run: npm run extension:sync-common:check

      - name: Version metadata check
        run: npm run versions:check

      - name: Test surface stats
        run: npm run test:stats

      - name: Coverage regression
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Runtime smoke
        run: npm run test:smoke:runtime

      - name: Build
        run: npm run build

      - name: Docker smoke
        run: npm run docker:smoke
