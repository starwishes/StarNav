<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, initial-scale=1.0" />
  <title>StarNav</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <div class="logo-copy">
          <span class="logo-text">StarNav</span>
          <span class="logo-meta">Quick capture</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="openSite" class="icon-btn" title="Open StarNav">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Logout" aria-label="Logout" style="display: none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
        <button id="themeToggle" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="i18nToggle" class="icon-btn lang-toggle-btn" title="Switch Language">
          <span class="main-char">A</span>
          <span class="badge-char">文</span>
        </button>
      </div>
    </header>

    <section id="notConnected" class="not-connected" style="display: none">
      <div id="connectCard" class="not-connected-card">
        <div class="not-connected-eyebrow">StarNav</div>
        <h1 class="not-connected-title">Connect to StarNav</h1>
        <p class="not-connected-copy">Enter your server URL and credentials to connect.</p>
        <div class="form-group">
          <label for="reconnectServerUrl" data-i18n="serverUrl">Server URL</label>
          <input type="url" id="reconnectServerUrl" class="form-input" autocomplete="url" />
        </div>
        <div class="form-group">
          <label for="reconnectUsername" data-i18n="username">Username</label>
          <input type="text" id="reconnectUsername" class="form-input" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="reconnectPassword" data-i18n="password">Password</label>
          <input type="password" id="reconnectPassword" class="form-input" autocomplete="current-password" />
        </div>
        <div class="form-group form-group-checkbox">
          <label class="checkbox-label" for="reconnectRemember">
            <input type="checkbox" id="reconnectRemember" />
            <span data-i18n="rememberLogin">Keep me signed in (90 days)</span>
          </label>
        </div>
        <button id="reconnectBtn" class="primary-btn" type="button" data-i18n="connect">Connect</button>
      </div>
    </section>

    <main id="mainContent" class="popup-main">
      <section class="add-section" id="addSection">
        <button id="addCurrentBtn" class="add-btn" data-i18n="addCurrent">Add Current Page</button>
      </section>

      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" aria-label="Search bookmarks..." />
        <button id="clearSearch" class="clear-btn" aria-label="Clear search" title="Clear search" style="display: none">×</button>
      </div>

      <div id="searchResults" class="bookmark-list" style="display: none"></div>

      <section id="bookmarkList" class="bookmark-list">
        <div class="section-title" data-i18n="recentVisit">Recent bookmarks</div>
        <div id="recentBookmarks" class="bookmark-items"></div>
      </section>

      <section id="addForm" class="add-form" style="display: none">
        <div class="form-header">
          <span data-i18n="addBookmark">Add Bookmark</span>
          <button id="cancelAdd" class="icon-btn">×</button>
        </div>
        <div id="duplicateWarning" class="warning-alert" style="display: none">
          ⚠️ <span data-i18n="urlStored">URL already stored:</span><span id="duplicateName"></span>
        </div>
        <div class="form-group">
          <label for="bookmarkName" data-i18n="name">Name</label>
          <input type="text" id="bookmarkName" class="form-input" />
        </div>
        <div class="form-group">
          <label for="bookmarkUrl" data-i18n="url">URL</label>
          <input type="text" id="bookmarkUrl" class="form-input" />
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="bookmarkCategory" data-i18n="category">Category</label>
            <div class="select-with-add">
              <select id="bookmarkCategory" class="form-select"></select>
              <button id="addCategoryBtn" class="add-category-btn" title="New Category">+</button>
            </div>
          </div>
          <div class="form-group flex-1">
            <label for="bookmarkLevel" data-i18n="level">Visibility</label>
            <select id="bookmarkLevel" class="form-select">
              <option value="0" data-i18n="level0">Guest</option>
              <option value="1" data-i18n="level1">User</option>
              <option value="2" data-i18n="level2">VIP</option>
              <option value="3" data-i18n="level3">Admin Only</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="bookmarkDesc" data-i18n="description">Description (Optional)</label>
          <input type="text" id="bookmarkDesc" class="form-input" />
        </div>
        <div class="form-actions">
          <button id="submitBookmark" class="primary-btn" data-i18n="save">Save</button>
        </div>
      </section>

      <div id="categoryModal" class="modal" style="display: none">
        <div class="modal-content">
          <div class="form-header">
            <span data-i18n="newCategory">New Category</span>
            <button id="closeCategoryModal" class="icon-btn">×</button>
          </div>
          <div class="form-group">
            <label for="newCategoryParent" data-i18n="parentCategory">Parent Category</label>
            <select id="newCategoryParent" class="form-select">
              <option value="" data-i18n="rootCategory">None (Root)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="newCategoryName" data-i18n="categoryName">Category Name</label>
            <input type="text" id="newCategoryName" class="form-input" />
          </div>
          <div class="form-group">
            <label for="newCategoryLevel" data-i18n="level">Visibility</label>
            <select id="newCategoryLevel" class="form-select">
              <option value="0" data-i18n="level0">Guest</option>
              <option value="1" data-i18n="level1">User</option>
              <option value="2" data-i18n="level2">VIP</option>
              <option value="3" data-i18n="level3">Admin Only</option>
            </select>
          </div>
          <div class="form-actions">
            <button id="submitCategory" class="primary-btn" data-i18n="create">Create</button>
          </div>
        </div>
      </div>
    </main>

    <div id="loading" class="loading-overlay" style="display: none">
      <div class="spinner"></div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" style="display: none"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>

</html>
